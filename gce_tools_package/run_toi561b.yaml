# One file per model run: network, planet, initial guess, solver paths, grid.
network: networks/mgsio3_h2.yaml

planet:
  name: TOI_561b
  mass_earth: 2.24
  radius_earth: 1.42
  surface_pressure_bar: 1000
  metal_mass_fraction: 0.2466
  # atm_mass_fraction: 1.0e-4   # uncomment to set directly instead of from pressure

# Mole fractions per phase. Leave a species out to give it `floor`;
# set it to 0 to keep it at exactly 0. Each phase is renormalised.
initial_guess:
  gas:      {H2: 0.999, H2O: 0.001}
  metal:    {Fe: 0.999}
  silicate: {MgO: 0.032, SiO2: 0.011, MgSiO3: 0.9211, FeO: 0.0005,
             FeSiO3: 0.0005, Na2O: 0.007, Na2SiO3: 0.001}
floor: 1.0e-6

solver:
  base_dir: /Users/mcgintya/Documents/Python_scripts/GlobalChemicalEquilibrium_model/Standard_Version
  executable: ./solver
  chem_input: chem_input.dat
  param: param.dat
  initial: initial.dat
  temperature_key: T_AMOI
  mass_key: Mplanet_Mearth       # planet.mass_earth is written here
  output_key: Output file
  eta_key: eta

grid:
  T_start: 2500
  T_end: 4000
  T_step: 100
  tol: 1.0e-8
  run_dir: /Users/mcgintya/Documents/Python_scripts/GlobalChemicalEquilibrium_model/Standard_Version/runs/TOI_561b/Testing/MgSiO3/1000_bar
  output_name: "{planet}_H2_Ps_{Ps:.0f}_Ts_{T}.dat"   # matches your existing files
  update_chem_input: false
  warm_start_initial: true
  stop_on_failure: true
  eta_schedule: [[2000, 0.4], [2500, 0.2], [null, 0.1]]
